<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Hackathon Ideas</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <header class="top-bar">
    <div class="logo">AI Hackathon <span class="logo-accent">Ideas</span></div>
    <button class="wishlist-btn" id="wishlistBtn" aria-label="View wishlist">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
      </svg>
      <span class="wishlist-count" id="wishlistCount">0</span>
    </button>
  </header>

  <main class="carousel-container">
    <div class="peek-card peek-card--left" id="peekLeft" aria-hidden="true"></div>
    <div class="carousel-scene">
      <div class="carousel" id="carousel"></div>
    </div>
    <div class="peek-card peek-card--right" id="peekRight" aria-hidden="true"></div>
  </main>

  <footer class="controls">
    <button class="control-btn" id="prevBtn" aria-label="Previous idea">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
    </button>
    <button class="control-btn control-btn--primary" id="playPauseBtn" aria-label="Pause rotation">
      <svg class="icon-pause" width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
        <rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>
      </svg>
      <svg class="icon-play" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" style="display:none">
        <polygon points="5 3 19 12 5 21 5 3"/>
      </svg>
    </button>
    <button class="control-btn" id="nextBtn" aria-label="Next idea">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="9 18 15 12 9 6"/>
      </svg>
    </button>
  </footer>

  <!-- Wishlist Modal -->
  <div class="modal-overlay" id="wishlistModal">
    <div class="modal">
      <div class="modal-header">
        <h2>My Favorites</h2>
        <button class="modal-close" id="modalClose" aria-label="Close">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
      <div class="modal-body" id="wishlistList"></div>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
